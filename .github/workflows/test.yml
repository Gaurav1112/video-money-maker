name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Layer 2/3/5/6: Fast unit + integrity + determinism + security ─────────
  unit:
    name: "Unit · integrity · determinism · security"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # F008 — explicit production-code type-check gate (blocking).
      # tsconfig.build.json excludes test files; the pre-existing
      # @types/jest test-file gap is tracked in docs/test-burndown.md.
      - name: Typecheck (production build config)
        run: npm run typecheck:build

      # F008 — ESLint gate. Non-blocking for now (continue-on-error) so
      # day-1 CI is not broken by the ~588 pre-existing warnings. Flip to
      # blocking once the warning backlog is burned down — see
      # docs/test-burndown.md and the dev-harness audit.
      - name: Lint (ESLint, non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Run integrity tests
        run: npm run test:integrity

      - name: Run determinism tests
        run: npm run test:determinism

      - name: Run security tests
        run: npm run test:security

      - name: Run publishing tests
        run: npm run test:publishing

  # ─── Layer 4: Format validation ──────────────────────────────────────────
  format:
    name: "Format · shorts · longform"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run format tests
        run: npm run test:format

  # ─── Layer 1: Retention (includes audio fixtures via ffmpeg) ─────────────
  retention:
    name: "Retention · audio LUFS · ducking · opener · captions"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit, format]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install ffmpeg system package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y "ffmpeg=7:*" fonts-dejavu fonts-noto || true

      - name: Cache Remotion bundler
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/remotion
            node_modules/.cache
          key: remotion-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            remotion-${{ runner.os }}-

      - run: npm ci

      - name: Build audio fixtures
        run: npm run test:fixtures

      - name: Run retention tests
        run: npm run test:retention

  # ─── Full suite with coverage gate ───────────────────────────────────────
  coverage:
    name: "Coverage gate (≥ 40% global / per-layer targets)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit, format, retention]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y "ffmpeg=7:*" fonts-dejavu fonts-noto || true

      - run: npm ci

      - name: Build fixtures
        run: npm run test:fixtures

      - name: Run full test suite with coverage
        run: npm run test:ci

      - name: Run topic-bank invariants (node:test)
        run: npm run test:topic-bank

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload failed-render frames (debug)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-frames
          path: tests/fixtures/_renders/
          retention-days: 3

  # ─── Matrix: run each layer in parallel after unit passes ────────────────
  layers:
    name: "Layer · ${{ matrix.layer }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit]
    strategy:
      fail-fast: false
      matrix:
        layer: [retention, integrity, publishing, format, determinism, security, stock]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install ffmpeg (needed for audio and stock layers)
        if: matrix.layer == 'retention' || matrix.layer == 'stock'
        run: sudo apt-get update -qq && sudo apt-get install -y "ffmpeg=7:*" fonts-dejavu fonts-noto || true

      - run: npm ci

      - name: Build fixtures (retention only)
        if: matrix.layer == 'retention'
        run: npm run test:fixtures

      - name: Run ${{ matrix.layer }} tests
        run: npx vitest run --reporter=verbose --passWithNoTests tests/${{ matrix.layer }}
