name: Weekly Opinion-Piece Publish

on:
  schedule:
    - cron: '0 12 * * 0'   # Sunday 12 UTC = 5:30 PM IST
  workflow_dispatch:
    inputs:
      episode:
        description: 'Episode slug (e.g. 001-microservices-vs-monolith); empty = next unpublished'
        required: false

permissions:
  contents: write

concurrency:
  group: weekly-opinion
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      EDGE_TTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install ffmpeg + Edge TTS + Chromium for Remotion
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          pip install --break-system-packages edge-tts
          npx remotion browser ensure
      - name: Render + upload
        env:
          INPUT_EPISODE: ${{ inputs.episode }}
        run: |
          EPISODE="$INPUT_EPISODE"
          if [ -n "$EPISODE" ]; then
            npx tsx scripts/upload-opinion-piece.ts --episode "$EPISODE"
          else
            npx tsx scripts/upload-opinion-piece.ts --next-unpublished
          fi
      - name: Commit dedupe record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/opinions-published/
          git diff --staged --quiet || git commit -m "chore(opinions): published $(date -u +%Y-%m-%d)"
          git push
