name: Weekly Decision Digest

on:
  workflow_dispatch:
  schedule:
    # Sundays 05:00 UTC = 10:30 IST — after the 04:30 UTC daily channel inventory
    - cron: '0 5 * * 0'

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git show HEAD~7` resolves the week-ago snapshot.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Generate weekly digest (F011)
        run: npx tsx scripts/weekly-digest.ts > data/analytics/weekly-digest.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/analytics/weekly-digest.md
          git diff --staged --quiet || git commit -m "chore(analytics): weekly decision digest $(date -u +%Y-%m-%d)"
          git push
