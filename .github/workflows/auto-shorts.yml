name: Auto Shorts Pipeline (2 Quiz Shorts Daily)

# Fully automated: renders 2 quiz Shorts from diverse topics,
# uploads to YouTube, distributes to all platforms.
# 61 unique quizzes across 12 topics = 30 days of content.
# Zero manual work required.

on:
  schedule:
    # 1:15 PM IST (07:45 UTC) Mon/Wed/Fri — lunch break scrolling peak
    # (per optimal_schedule memory: 6:15 PM IST is for long-form; 1:15 PM IST is Shorts)
    - cron: '45 7 * * 1,3,5'

  workflow_dispatch:
    inputs:
      quiz_number:
        description: 'Specific quiz number (0-60), leave empty for auto-pick'
        required: false
      dry_run:
        description: 'Render only, no upload'
        type: boolean
        default: false
      force_formula:
        description: 'A/B hook formula: auto (data-driven), specific_stat, wrong_answer_first, or both (always render both)'
        type: choice
        required: false
        default: 'auto'
        options:
          - auto
          - specific_stat
          - wrong_answer_first
          - both

permissions:
  contents: write

concurrency:
  group: auto-shorts
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 70  # 4 renders (2 quizzes × 2 A/B variants) + 4 uploads ≈ 50 min; 70 gives buffer
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      EDGE_TTS: '1'  # Use Edge TTS on CI (Kokoro needs local GPU)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome + TTS + ffmpeg
        run: |
          npx remotion browser ensure
          pip install --break-system-packages edge-tts
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python3 -c "import edge_tts; print('edge_tts OK')"
          ffmpeg -version | head -1

      - name: Determine quiz numbers
        id: quizzes
        env:
          INPUT_QUIZ_NUMBER: ${{ inputs.quiz_number }}
        run: |
          DOY=$(date +%j)
          if [ -n "$INPUT_QUIZ_NUMBER" ]; then
            echo "quiz1=$INPUT_QUIZ_NUMBER" >> $GITHUB_OUTPUT
            echo "quiz2=$(( (INPUT_QUIZ_NUMBER + 1) % 61 ))" >> $GITHUB_OUTPUT
          else
            # Topic-diverse selection: pick from different topic groups
            TOPIC_STARTS=(0 12 18 23 28 33 37 41 45 50 54 58)
            TOPIC_SIZES=(12 6 5 5 5 4 4 4 5 4 4 3)
            T1_IDX=$(( DOY % 12 ))
            T2_IDX=$(( (DOY + 6) % 12 ))
            Q1=$(( TOPIC_STARTS[T1_IDX] + (DOY / 12) % TOPIC_SIZES[T1_IDX] ))
            Q2=$(( TOPIC_STARTS[T2_IDX] + (DOY / 12) % TOPIC_SIZES[T2_IDX] ))
            echo "quiz1=$Q1" >> $GITHUB_OUTPUT
            echo "quiz2=$Q2" >> $GITHUB_OUTPUT
          fi
          echo "Selected quizzes: $Q1, $Q2"

      - name: Compute formula flag
        id: formula
        env:
          INPUT_FORCE_FORMULA: ${{ inputs.force_formula }}
        run: |
          FF="$INPUT_FORCE_FORMULA"
          if [ -z "$FF" ] || [ "$FF" = "auto" ]; then
            echo "flag=" >> $GITHUB_OUTPUT
          else
            echo "flag=--force-formula $FF" >> $GITHUB_OUTPUT
          fi
          echo "Formula flag: '$FF'"

      - name: Render Quiz Short 1
        id: render1
        env:
          QUIZ1: ${{ steps.quizzes.outputs.quiz1 }}
          FORMULA_FLAG: ${{ steps.formula.outputs.flag }}
        run: |
          echo "=== Rendering Quiz #$QUIZ1 ==="
          npx tsx scripts/render-daily-short.ts --short "$QUIZ1" $FORMULA_FLAG
          # When A/B is on, render-daily-short.ts emits *-variantA.mp4 / *-variantB.mp4.
          # Pick the most-recent base id so downstream steps can iterate variants.
          BASE=$(ls -t output/daily-short/*.mp4 | head -1 | sed -E 's/-variant[AB]\.mp4$//;s/\.mp4$//')
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "Rendered base: $BASE"
          ls -lh "$BASE"*.mp4

      - name: Render Quiz Short 2
        id: render2
        env:
          QUIZ2: ${{ steps.quizzes.outputs.quiz2 }}
          FORMULA_FLAG: ${{ steps.formula.outputs.flag }}
        run: |
          echo "=== Rendering Quiz #$QUIZ2 ==="
          npx tsx scripts/render-daily-short.ts --short "$QUIZ2" $FORMULA_FLAG
          BASE=$(ls -t output/daily-short/*.mp4 | head -1 | sed -E 's/-variant[AB]\.mp4$//;s/\.mp4$//')
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "Rendered base: $BASE"
          ls -lh "$BASE"*.mp4

      - name: Verify renders
        run: |
          echo "=== Rendered Shorts ==="
          for f in output/daily-short/*.mp4; do
            DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" 2>/dev/null | cut -d. -f1)
            RES=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$f" 2>/dev/null)
            SIZE=$(du -h "$f" | cut -f1)
            echo "  $(basename $f): ${DUR}s, ${RES}, ${SIZE}"
          done

      - name: Upload Short 1 variants to YouTube
        if: inputs.dry_run != true
        env:
          RENDER1_BASE: ${{ steps.render1.outputs.base }}
        run: |
          echo "=== Uploading Short 1 variants ==="
          BASE="$RENDER1_BASE"
          # Iterate any -variantA / -variantB files plus the single-variant case.
          # Each upload is wrapped in `|| true` per FR-008 (one failure does not
          # abort the other variant).
          for VIDEO in "$BASE.mp4" "$BASE-variantA.mp4" "$BASE-variantB.mp4"; do
            [ -f "$VIDEO" ] || continue
            ID=$(basename "${VIDEO%.mp4}")
            META="output/daily-short/$(basename "$BASE")-metadata.json"
            PROPS="output/daily-short-$ID.json"
            EQ=$(node -e "const j=require('./'+process.argv[1]); console.log((j.quiz?.endQuestion ?? '').replace(/[\"\\\\]/g, ''))" "$PROPS" 2>/dev/null || echo "")
            THUMB="${VIDEO%.mp4}-thumbnail.jpg"
            SRT="${VIDEO%.mp4}.srt"
            PARTIAL="data/variants/$ID.partial.json"
            echo "--- variant $ID ---"
            # F009: --dedup-key "$ID" — $ID is the per-variant key
            # (${topic}-quiz-${index}[-variantA|-variantB]). upload-youtube.ts
            # skips (exit 0) if data/uploaded/$ID.json exists, else records it
            # after a successful upload. Stops rotation wrap-around re-uploads.
            npx tsx scripts/upload-youtube.ts "$VIDEO" "$META" --shorts \
              --dedup-key "$ID" \
              $([ -f "$THUMB" ] && echo "--thumbnail $THUMB") \
              $([ -f "$SRT" ] && echo "--captions $SRT") \
              $([ -n "$EQ" ] && echo "--first-comment \"$EQ 👀\"") \
              $([ -f "$PARTIAL" ] && echo "--variant-record $PARTIAL") \
              || echo "Upload $ID failed (continuing)"
          done

      - name: Upload Short 2 variants to YouTube
        if: inputs.dry_run != true
        env:
          RENDER2_BASE: ${{ steps.render2.outputs.base }}
        run: |
          echo "=== Uploading Short 2 variants ==="
          BASE="$RENDER2_BASE"
          for VIDEO in "$BASE.mp4" "$BASE-variantA.mp4" "$BASE-variantB.mp4"; do
            [ -f "$VIDEO" ] || continue
            ID=$(basename "${VIDEO%.mp4}")
            META="output/daily-short/$(basename "$BASE")-metadata.json"
            PROPS="output/daily-short-$ID.json"
            EQ=$(node -e "const j=require('./'+process.argv[1]); console.log((j.quiz?.endQuestion ?? '').replace(/[\"\\\\]/g, ''))" "$PROPS" 2>/dev/null || echo "")
            THUMB="${VIDEO%.mp4}-thumbnail.jpg"
            SRT="${VIDEO%.mp4}.srt"
            PARTIAL="data/variants/$ID.partial.json"
            echo "--- variant $ID ---"
            # F009: see Upload Short 1 step — --dedup-key dedups per quiz variant.
            npx tsx scripts/upload-youtube.ts "$VIDEO" "$META" --shorts \
              --dedup-key "$ID" \
              $([ -f "$THUMB" ] && echo "--thumbnail $THUMB") \
              $([ -f "$SRT" ] && echo "--captions $SRT") \
              $([ -n "$EQ" ] && echo "--first-comment \"$EQ 👀\"") \
              $([ -f "$PARTIAL" ] && echo "--variant-record $PARTIAL") \
              || echo "Upload $ID failed (continuing)"
          done

      - name: Commit variant + upload-ledger records
        if: inputs.dry_run != true
        run: |
          # Persist data/variants/<videoId>.json files written by upload step
          # so the analytics workflow can join them with metrics later.
          # F009: also persist data/uploaded/<quizKey>.json upload-ledger
          # records so the per-quiz dedup survives across CI runs.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/variants/*.json data/uploaded/*.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data(f009): record uploaded A/B variants + upload-ledger $(date -u +%Y-%m-%dT%H:%MZ)"
            git push || echo "push failed (non-fatal)"
          else
            echo "No new variant/ledger records to commit"
          fi

      - name: Upload variants to Instagram Reels (F004)
        if: inputs.dry_run != true
        continue-on-error: true
        env:
          # New "Instagram API with Instagram Login" credentials (preferred).
          IG_USER_ID:             ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:        ${{ secrets.IG_ACCESS_TOKEN }}
          # Legacy Facebook-Login names — kept as fallback.
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID:  ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          R2_ACCOUNT_ID:          ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:       ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:   ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:         ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL:          ${{ secrets.R2_PUBLIC_URL }}
        run: |
          echo "=== Instagram Reels upload (F004) ==="
          for VIDEO in output/daily-short/*.mp4; do
            [ -f "$VIDEO" ] || continue
            BASE="${VIDEO%-variantA.mp4}"
            BASE="${BASE%-variantB.mp4}"
            BASE="${BASE%.mp4}"
            META="${BASE}-metadata.json"
            if [ ! -f "$META" ]; then
              echo "[ig] no metadata for $VIDEO, skipping"
              continue
            fi
            echo "--- IG upload: $(basename $VIDEO) ---"
            npx tsx scripts/upload-instagram-wrapper.ts "$VIDEO" "$META" || true
          done

      # TikTok upload step REMOVED 2026-05-22 (F005 cancelled): TikTok is
      # banned in India, the operator's market. scripts/upload-tiktok.ts +
      # lib/tiktok-client.ts kept on disk but no longer wired into the pipeline.

      - name: Generate distribution packages
        run: |
          for f in output/daily-short/*.mp4; do
            echo "=== Distributing $(basename $f) ==="
            npx tsx scripts/distribute-short.ts "$f" || true
          done

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shorts-${{ github.run_number }}
          path: |
            output/daily-short/
            output/distribute/
          retention-days: 7

      - name: Summary
        run: |
          echo "## Daily Shorts Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Short | Title | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|------|" >> $GITHUB_STEP_SUMMARY
          for meta in output/daily-short/*-metadata.json; do
            TITLE=$(python3 -c "import json; print(json.load(open('$meta'))['youtube']['title'])" 2>/dev/null || echo "?")
            VIDEO="${meta%-metadata.json}.mp4"
            SIZE=$(du -h "$VIDEO" 2>/dev/null | cut -f1 || echo "?")
            echo "| $(basename $VIDEO) | $TITLE | $SIZE |" >> $GITHUB_STEP_SUMMARY
          done
