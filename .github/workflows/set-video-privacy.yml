name: Set Video Privacy (restore / hide a video by ID)

on:
  workflow_dispatch:
    inputs:
      video_ids:
        description: 'Space-separated YouTube video IDs'
        required: true
      status:
        description: 'Target privacy status'
        required: true
        default: 'public'
        type: choice
        options: [public, private, unlisted]

permissions:
  contents: read

concurrency:
  group: set-video-privacy
  cancel-in-progress: false

jobs:
  set-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      - run: npm ci
      - name: Set privacy
        env:
          INPUT_STATUS: ${{ inputs.status }}
          INPUT_VIDEO_IDS: ${{ inputs.video_ids }}
        run: npx tsx scripts/set-video-privacy.ts --status "$INPUT_STATUS" $INPUT_VIDEO_IDS
